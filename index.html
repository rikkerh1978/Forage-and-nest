<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forage & Nest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<style>
  :root{
    --paper: #EDEFE0;
    --paper-card: #F7F6EC;
    --ink: #24301E;
    --ink-soft: #4A5540;
    --soil: #8B6B43;
    --soil-dark: #5B4530;
    --meadow: #4F6B3A;
    --meadow-light: #7C9760;
    --pollen: #C98F1E;
    --pollen-bg: #F3E3BB;
    --flower: #6E5A9E;
    --flower-bg: #E7E1F2;
    --rust: #9A4630;
    --rust-bg: #F0DAD2;
    --line: #C9C7B2;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif;
    font-size:15px;
    line-height:1.5;
  }
  h1,h2,h3,.display{
    font-family:'Fraunces', serif;
    font-weight:600;
    color:var(--ink);
    margin:0;
  }
  .wrap{max-width:1100px;margin:0 auto;padding:28px 22px 60px;}

  /* header */
  header{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    gap:20px;
    border-bottom:2px solid var(--ink);
    padding-bottom:16px;
    margin-bottom:22px;
    flex-wrap:wrap;
  }
  header .title-block h1{font-size:34px;letter-spacing:-0.01em;}
  header .title-block p{margin:6px 0 0;color:var(--ink-soft);max-width:46ch;font-size:14px;}
  .badge{
    font-family:'Fraunces', serif;
    font-size:13px;
    color:var(--ink-soft);
    border:1px solid var(--line);
    background:var(--paper-card);
    padding:8px 14px;
    white-space:nowrap;
  }
  .badge strong{color:var(--ink);font-size:15px;}

  /* nickname gate */
  .gate{
    max-width:440px;
    margin:60px auto;
    background:var(--paper-card);
    border:1px solid var(--line);
    padding:30px;
    text-align:left;
  }
  .gate h2{font-size:22px;margin-bottom:10px;}
  .gate p{color:var(--ink-soft);font-size:14px;margin-bottom:18px;}
  .gate input{width:100%;padding:10px 12px;font-size:15px;font-family:inherit;border:1px solid var(--soil);background:#fff;margin-bottom:14px;}
  .gate button{width:100%;}

  /* layout */
  .layout{display:grid;grid-template-columns:230px 1fr;gap:24px;align-items:start;}
  @media (max-width:820px){.layout{grid-template-columns:1fr;}}

  .rail{border-right:1px solid var(--line);padding-right:16px;}
  @media (max-width:820px){.rail{border-right:none;border-bottom:1px solid var(--line);padding-right:0;padding-bottom:16px;}}
  .rail-label{font-size:11px;letter-spacing:.03em;color:var(--ink-soft);margin-bottom:10px;}
  .species-item{
    display:block;width:100%;text-align:left;background:none;border:none;
    border-left:3px solid transparent;
    padding:9px 10px;cursor:pointer;font-family:'Fraunces',serif;font-size:15px;color:var(--ink-soft);
  }
  .species-item .lat{display:block;font-family:'IBM Plex Sans',sans-serif;font-size:11.5px;color:var(--ink-soft);font-style:italic;opacity:.75;}
  .species-item:hover{background:rgba(0,0,0,0.03);}
  .species-item.active{border-left-color:var(--pollen);color:var(--ink);background:rgba(0,0,0,0.03);}
  .species-item .pop-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:middle;}

  main{min-height:400px;}

  /* tabs */
  .tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:20px;flex-wrap:wrap;}
  .tab{
    background:none;border:none;font-family:'IBM Plex Sans',sans-serif;font-size:13.5px;font-weight:500;
    color:var(--ink-soft);padding:10px 14px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;
  }
  .tab.active{color:var(--ink);border-bottom-color:var(--ink);}
  .tab:disabled{opacity:0.4;cursor:not-allowed;}

  .panel{display:none;}
  .panel.active{display:block;}

  .card{background:var(--paper-card);border:1px solid var(--line);padding:20px;}
  .card + .card{margin-top:14px;}

  button.primary{
    background:var(--ink);color:var(--paper);border:none;padding:10px 18px;
    font-family:'IBM Plex Sans',sans-serif;font-size:14px;font-weight:500;cursor:pointer;
  }
  button.primary:hover{background:var(--soil-dark);}
  button.secondary{
    background:none;color:var(--ink);border:1px solid var(--ink);padding:9px 16px;
    font-family:'IBM Plex Sans',sans-serif;font-size:13.5px;cursor:pointer;
  }
  button.secondary:hover{background:rgba(0,0,0,0.04);}

  label{display:block;font-size:12.5px;color:var(--ink-soft);margin-bottom:5px;margin-top:14px;}
  label:first-child{margin-top:0;}
  input[type=text], select, textarea{
    width:100%;padding:9px 10px;font-family:inherit;font-size:14px;border:1px solid var(--soil);background:#fff;color:var(--ink);
  }
  textarea{resize:vertical;min-height:56px;}

  .tag{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:2px;font-weight:500;}
  .tag.match{background:var(--meadow);color:#fff;}
  .tag.plant{background:var(--pollen-bg);color:var(--pollen);}
  .tag.nest{background:var(--soil);color:#fff;}
  .tag.flower{background:var(--flower-bg);color:var(--flower);}

  .host-plant-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px;}
  .host-plant-row:last-child{border-bottom:none;}
  .host-plant-row .lat{font-style:italic;color:var(--ink-soft);}

  .suggestions{border:1px solid var(--soil);border-top:none;background:#fff;max-height:180px;overflow-y:auto;}
  .suggestion{padding:8px 10px;cursor:pointer;font-size:13.5px;}
  .suggestion:hover{background:var(--pollen-bg);}
  .suggestion .lat{font-style:italic;color:var(--ink-soft);}
  .api-note{font-size:12px;color:var(--ink-soft);margin-top:4px;}

  .feed-item{padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px;}
  .feed-item:last-child{border-bottom:none;}
  .feed-item .meta{color:var(--ink-soft);font-size:12px;margin-top:2px;}

  /* population meter */
  .pop-meter{display:flex;align-items:baseline;gap:10px;margin-bottom:8px;}
  .pop-meter .num{font-family:'Fraunces',serif;font-size:44px;font-weight:600;}
  .pop-meter .status{font-size:13px;padding:3px 10px;border-radius:2px;font-weight:500;}
  .meter-track{height:10px;background:var(--line);width:100%;position:relative;overflow:hidden;}
  .meter-fill{height:100%;background:var(--meadow);transition:width .5s ease;}
  .stat-row{display:flex;gap:24px;margin-top:16px;flex-wrap:wrap;}
  .stat{font-size:13px;color:var(--ink-soft);}
  .stat b{display:block;font-family:'Fraunces',serif;font-size:20px;color:var(--ink);font-weight:600;}

  .season-log{margin-top:18px;}
  .season-log .entry{padding:10px 0;border-bottom:1px dashed var(--line);font-size:13.5px;}
  .season-log .entry:last-child{border-bottom:none;}
  .delta-pos{color:var(--meadow);font-weight:600;}
  .delta-neg{color:var(--rust);font-weight:600;}

  .empty{color:var(--ink-soft);font-size:13.5px;font-style:italic;padding:16px 0;}
  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    background:var(--ink);color:var(--paper);padding:11px 20px;font-size:13.5px;
    opacity:0;pointer-events:none;transition:opacity .3s ease, transform .3s ease;z-index:50;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}
  .divider{height:1px;background:var(--line);margin:18px 0;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  @media (max-width:520px){.grid2{grid-template-columns:1fr;}}
  .extinct-box{background:var(--rust-bg);border:1px solid var(--rust);padding:16px;margin-top:14px;}
  .atlas-species-block{margin-bottom:22px;}
  .atlas-species-block h3{font-size:16px;margin-bottom:8px;}
  .count-row{display:flex;gap:18px;font-size:13px;color:var(--ink-soft);margin-bottom:10px;}

  .photo-row{display:flex;gap:10px;margin-top:6px;flex-wrap:wrap;}
  .photo-btn{
    background:none;border:1px dashed var(--soil);color:var(--ink-soft);
    padding:9px 14px;font-family:'IBM Plex Sans',sans-serif;font-size:13px;cursor:pointer;
  }
  .photo-btn:hover{background:rgba(0,0,0,0.03);}
  .photo-preview{margin-top:10px;position:relative;display:inline-block;}
  .photo-preview img{width:120px;height:120px;object-fit:cover;border:1px solid var(--line);display:block;}
  .photo-remove{
    position:absolute;top:-8px;right:-8px;background:var(--ink);color:#fff;border:none;
    width:22px;height:22px;border-radius:50%;font-size:13px;cursor:pointer;line-height:1;
  }
  .photo-note{font-size:12px;color:var(--ink-soft);margin-top:6px;}
  .feed-item{display:flex;gap:10px;}
  .feed-item .feed-thumb{width:44px;height:44px;object-fit:cover;border:1px solid var(--line);flex-shrink:0;}
  .feed-item .feed-body{flex:1;min-width:0;}

  /* XP / level */
  .xp-badge{display:flex;flex-direction:column;align-items:flex-end;gap:4px;}
  .xp-badge .level-name{font-family:'Fraunces',serif;font-size:14px;color:var(--ink);}
  .xp-track{width:140px;height:6px;background:var(--line);position:relative;overflow:hidden;}
  .xp-fill{height:100%;background:var(--pollen);transition:width .6s ease;}
  .xp-sub{font-size:10.5px;color:var(--ink-soft);}

  /* habitat scene */
  .scene{
    position:relative;width:100%;height:190px;overflow:hidden;
    background:linear-gradient(to bottom, #E4E9D6 0%, #E4E9D6 55%, var(--soil) 55%, var(--soil-dark) 100%);
    border:1px solid var(--line);margin-bottom:16px;
  }
  .scene .bee-icon{position:absolute;animation:buzz 3.2s ease-in-out infinite;}
  .scene .flower-icon{position:absolute;bottom:8%;}
  .scene .nest-icon{position:absolute;bottom:4%;left:50%;transform:translateX(-50%);}
  @keyframes buzz{
    0%,100%{transform:translate(0,0) rotate(0deg);}
    25%{transform:translate(3px,-4px) rotate(4deg);}
    50%{transform:translate(-2px,-7px) rotate(-3deg);}
    75%{transform:translate(-4px,-2px) rotate(2deg);}
  }
  @media (prefers-reduced-motion: reduce){ .scene .bee-icon{animation:none;} }
  .scene-empty-note{position:absolute;top:8px;left:10px;font-size:11.5px;color:var(--ink-soft);background:rgba(247,246,236,.85);padding:2px 7px;}

  /* achievements */
  .badge-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;margin-top:14px;}
  .ach{border:1px solid var(--line);padding:12px 10px;text-align:center;background:var(--paper-card);}
  .ach.locked{opacity:0.38;}
  .ach .ach-icon{margin:0 auto 6px;}
  .ach .ach-name{font-family:'Fraunces',serif;font-size:13px;color:var(--ink);}
  .ach .ach-desc{font-size:11px;color:var(--ink-soft);margin-top:3px;}

  .event-card{
    display:flex;align-items:center;gap:12px;background:var(--paper-card);border:1px solid var(--line);
    padding:12px 14px;margin-top:14px;animation:popin .35s ease;
  }
  @keyframes popin{from{opacity:0;transform:scale(.94) translateY(4px);} to{opacity:1;transform:scale(1) translateY(0);}}
  @keyframes confetti-fall{
    0%{transform:translateY(0) rotate(0deg);opacity:0.95;}
    100%{transform:translateY(100vh) rotate(540deg);opacity:0;}
  }
  .mascot-greeting{display:flex;align-items:center;gap:12px;margin-bottom:16px;}
  .mascot-greeting .bubble{
    background:var(--paper-card);border:1px solid var(--line);border-radius:2px;padding:10px 14px;
    font-size:13.5px;position:relative;flex:1;
  }
  .sound-toggle{
    background:none;border:1px solid var(--line);color:var(--ink-soft);font-size:12px;
    padding:5px 10px;cursor:pointer;
  }

  /* Bee Vision */
  .beevision-stage{
    position:relative;width:100%;aspect-ratio:3/4;max-height:70vh;background:#111;
    overflow:hidden;border:1px solid var(--line);
  }
  .beevision-stage video{
    width:100%;height:100%;object-fit:cover;display:block;
    filter:saturate(2.2) hue-rotate(200deg) contrast(1.15) brightness(1.05);
  }
  .beevision-hex-overlay{
    position:absolute;inset:0;pointer-events:none;mix-blend-mode:multiply;opacity:0.55;
    background-image:
      linear-gradient(30deg, #000 1px, transparent 1px),
      linear-gradient(150deg, #000 1px, transparent 1px),
      linear-gradient(270deg, #000 1px, transparent 1px);
    background-size: 34px 60px;
  }
  .beevision-vignette{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 60px 20px rgba(0,0,0,0.55);}
  .beevision-controls{display:flex;gap:10px;margin-top:12px;}

  /* Field Mode */
  .radar-list{margin-top:14px;}
  .radar-item{
    display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px;
  }
  .radar-item:last-child{border-bottom:none;}
  .radar-item.found{color:var(--meadow);}
  .minigame-stage{position:relative;width:100%;height:340px;background:#E4E9D6;border:1px solid var(--line);overflow:hidden;}
  .minigame-stage > div{will-change:top;}
  .radar-dist{font-family:'Fraunces',serif;font-size:15px;color:var(--ink);}
  .field-status{font-size:13px;color:var(--ink-soft);margin-top:8px;}

  .event-card.pos{border-left:4px solid var(--meadow);}
  .event-card.neg{border-left:4px solid var(--rust);}
  .achievement-toast{
    position:fixed;top:16px;left:50%;transform:translateX(-50%) translateY(-20px);
    background:var(--ink);color:var(--paper);padding:12px 20px;font-size:13.5px;display:flex;gap:10px;align-items:center;
    opacity:0;transition:opacity .35s ease, transform .35s ease;z-index:60;pointer-events:none;
  }
  .achievement-toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  /* site map */
  .map-container{border:1px solid var(--line);background:#F2F3E8;position:relative;}
  .map-legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:12px;font-size:12.5px;color:var(--ink-soft);}
  .map-legend .swatch{display:inline-flex;align-items:center;gap:5px;}
  .map-legend .dot{width:10px;height:10px;border-radius:50%;display:inline-block;}
  .map-point-label{font-size:10px;fill:var(--ink-soft);font-family:'IBM Plex Sans',sans-serif;}

  /* AI plant ID */
  .ai-id-box{border:1px dashed var(--flower);background:var(--flower-bg);padding:12px 14px;margin-top:10px;}
  .ai-id-box .ai-id-label{font-size:11.5px;color:var(--flower);font-weight:500;margin-bottom:8px;}
  .ai-chip{
    display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--flower);
    padding:7px 12px;margin:0 6px 6px 0;cursor:pointer;font-size:13px;
  }
  .ai-chip:hover{background:var(--flower-bg);}
  .ai-chip .conf{font-size:10.5px;padding:1px 6px;border-radius:2px;color:#fff;}
  .ai-chip .conf.high{background:var(--meadow);}
  .ai-chip .conf.medium{background:var(--pollen);}
  .ai-chip .conf.low{background:var(--rust);}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>
<div class="achievement-toast" id="ach-toast"></div>

<script>
// ---------- SUPABASE (shared backend for sightings & nest sites) ----------
// Personal player progress (population, XP, achievements) stays in Claude's built-in
// storage; only the shared, cross-user Community Atlas data lives here. Talking to
// PostgREST directly with plain fetch() \u2014 no @supabase/supabase-js client library \u2014
// since the library's internal machinery triggered a DataCloneError in a sandboxed
// artifact environment previously. This requires outbound network access to be allowed
// for artifacts on this account \u2014 it's blocked by policy on some enterprise accounts.
const SUPABASE_URL = 'https://xdtrapkijrlhkxfysslp.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_99x_ApdArOdVAEfYF4tbeQ_UxHlI7d7';
const SUPABASE_HEADERS = {
  'apikey': SUPABASE_ANON_KEY,
  'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
  'Content-Type': 'application/json'
};

// "Load failed" here means the request never reached the server \u2014 consistent with an
// intermittent network-level block. Retrying with backoff gives transient blocks a chance
// to clear before giving up.
async function fetchWithRetries(url, options, attempts=3){
  let lastErr;
  for(let i=0;i<attempts;i++){
    try{
      return await fetch(url, options);
    }catch(e){
      lastErr = e;
      if(i < attempts-1) await new Promise(r=>setTimeout(r, 500*(i+1)));
    }
  }
  throw new Error(`Network request failed after ${attempts} attempts: ${lastErr && lastErr.message || lastErr}`);
}

async function pgrestInsert(table, row){
  const res = await fetchWithRetries(`${SUPABASE_URL}/rest/v1/${table}`, {
    method: 'POST',
    headers: {...SUPABASE_HEADERS, 'Prefer': 'return=minimal'},
    body: JSON.stringify(row)
  });
  if(!res.ok){
    let detail = '';
    try{ const j = await res.json(); detail = j.message || j.hint || JSON.stringify(j); }catch(e){ detail = res.statusText; }
    throw new Error(`Supabase insert failed (${res.status}): ${detail}`);
  }
}

async function pgrestSelect(table, speciesId, limit){
  const params = new URLSearchParams();
  params.set('select', '*');
  params.set('order', 'created_at.desc');
  if(speciesId) params.set('species_id', `eq.${speciesId}`);
  if(limit) params.set('limit', String(limit));
  const res = await fetchWithRetries(`${SUPABASE_URL}/rest/v1/${table}?${params.toString()}`, {
    method: 'GET',
    headers: SUPABASE_HEADERS
  });
  if(!res.ok){
    let detail = '';
    try{ const j = await res.json(); detail = j.message || j.hint || JSON.stringify(j); }catch(e){ detail = res.statusText; }
    throw new Error(`Supabase read failed (${res.status}): ${detail}`);
  }
  return await res.json();
}

function sightingFromRow(row){
  return {
    id: row.id, type:'plant', speciesId: row.species_id, speciesCommon: row.species_common,
    plantLatin: row.plant_latin, plantCommon: row.plant_common,
    isHostMatch: row.is_host_match, isForageCredit: row.is_forage_credit,
    quantityEstimate: row.quantity_estimate, location: row.location_text, notes: row.notes,
    photo: row.photo, playerName: row.player_name, lat: row.lat, lon: row.lon,
    timestamp: row.created_at
  };
}
function nestFromRow(row){
  return {
    id: row.id, type:'nest', speciesId: row.species_id, speciesCommon: row.species_common,
    nestType: row.nest_type, nestTypeLabel: row.nest_type_label, location: row.location_text,
    field1Label: row.field1_label, field1Value: row.field1_value,
    field2Label: row.field2_label, field2Value: row.field2_value,
    field3Label: row.field3_label, field3Value: row.field3_value,
    notes: row.notes, photo: row.photo, playerName: row.player_name,
    lat: row.lat, lon: row.lon, timestamp: row.created_at
  };
}

async function sbInsertSighting(record){
  await pgrestInsert('sightings', {
    species_id: record.speciesId, species_common: record.speciesCommon,
    plant_latin: record.plantLatin, plant_common: record.plantCommon,
    is_host_match: record.isHostMatch, is_forage_credit: record.isForageCredit,
    quantity_estimate: record.quantityEstimate, location_text: record.location, notes: record.notes,
    photo: record.photo, player_name: record.playerName, lat: record.lat, lon: record.lon
  });
}
async function sbInsertNest(record){
  await pgrestInsert('nests', {
    species_id: record.speciesId, species_common: record.speciesCommon,
    nest_type: record.nestType, nest_type_label: record.nestTypeLabel, location_text: record.location,
    field1_label: record.field1Label, field1_value: record.field1Value,
    field2_label: record.field2Label, field2_value: record.field2Value,
    field3_label: record.field3Label, field3_value: record.field3Value,
    notes: record.notes, photo: record.photo, player_name: record.playerName,
    lat: record.lat, lon: record.lon
  });
}
async function sbFetchSightings(speciesId, limit){
  const rows = await pgrestSelect('sightings', speciesId, limit);
  return (rows||[]).map(sightingFromRow);
}
async function sbFetchNests(speciesId, limit){
  const rows = await pgrestSelect('nests', speciesId, limit);
  return (rows||[]).map(nestFromRow);
}

// ---------- SPECIES DATA ----------
// Bees documented as occurring in Denmark, spanning the flight season (early/mid/late)
// and a range of nest types (bare-soil ground nesters, cavity nesters, and two Bombus
// species with underground or surface nests). Distribution and host-plant pairings are
// drawn from general European bee-ecology knowledge, not a live database lookup or the

// Typical solitary-bee foraging range is a simplification \u2014 real ranges vary by species
// and body size (roughly 100m to over 1km) \u2014 300m is a reasonable working default.
const FORAGE_RANGE_M = 300;
const HIGH_QUANTITY_THRESHOLD = 50; // "sizeable patch" or larger, from the plant form

function haversineMeters(lat1, lon1, lat2, lon2){
  const R = 6371000;
  const toRad = d => d * Math.PI / 180;
  const dLat = toRad(lat2-lat1), dLon = toRad(lon2-lon1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

// Looks across the shared community atlas for this species: is there a nest site with GPS
// that has a high-quantity, matching host-plant sighting within foraging range?
async function findResourceLinkage(speciesId){
  try{
    const nests = (await sbFetchNests(speciesId)).filter(n=>n.lat!=null);
    if(nests.length===0) return {linked:false, reason:'no-gps-nest'};
    const sightings = (await sbFetchSightings(speciesId)).filter(s=>
      s.lat!=null && s.isForageCredit && s.quantityEstimate>=HIGH_QUANTITY_THRESHOLD);
    if(sightings.length===0) return {linked:false, reason:'no-gps-forage'};
    for(const n of nests){
      for(const p of sightings){
        if(haversineMeters(n.lat, n.lon, p.lat, p.lon) <= FORAGE_RANGE_M){
          return {linked:true, distance: Math.round(haversineMeters(n.lat,n.lon,p.lat,p.lon))};
        }
      }
    }
    return {linked:false, reason:'too-far'};
  }catch(e){
    console.error('Resource linkage check failed', e);
    return {linked:false, reason:'error'};
  }
}

function statusFor(pop){
  if(pop<=0) return {label:'Moved away', color:'var(--rust)'};
  if(pop<31) return {label:'Struggling', color:'var(--rust)'};

function computeXP(stats){

}
function levelInfo(xp){
  let current = LEVELS[0], next = LEVELS[1];
  for(let i=0;i<LEVELS.length;i++){
    if(xp >= LEVELS[i].xp) current = LEVELS[i];
    next = LEVELS[i+1] || null;
  }
  const span = next ? (next.xp - current.xp) : 1;
  const progress = next ? Math.min(1, (xp - current.xp) / span) : 1;
  return {current, next, progress};
}

// Checks achievements, updates player.stats.unlocked in place, returns array of newly unlocked achievement objects.
function checkAchievements(){
  const s = player.stats;
  const newlyUnlocked = [];
  ACHIEVEMENTS.forEach(a=>{
    if(!s.unlocked.includes(a.id) && a.check(s, player)){
      s.unlocked.push(a.id);
      newlyUnlocked.push(a);
    }
  });
  return newlyUnlocked;
}

// Call after any real logging action. Returns true if the streak count changed (so the
// caller can decide whether to celebrate), using calendar days in the browser's local time.
function registerDailyActivity(){
  const today = new Date().toISOString().slice(0,10); // YYYY-MM-DD, local-ish via ISO date part
  const s = player.stats;
  if(s.lastActiveDate === today) return false; // already counted today
  const yesterday = new Date(Date.now() - 86400000).toISOString().slice(0,10);
  s.currentStreak = (s.lastActiveDate === yesterday) ? (s.currentStreak||0) + 1 : 1;
  s.longestStreak = Math.max(s.longestStreak||0, s.currentStreak);
  s.lastActiveDate = today;
  return true;
}

// Tiny procedural sounds via Web Audio \u2014 no audio files to load. Muted by default the
// very first visit felt safer for a family app; the toggle state persists.
let soundEnabled = (localStorage.getItem('forage-nest-sound') !== 'off');
let audioCtx = null;
function getAudioCtx(){
  if(!audioCtx){
    try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ return null; }
  }
  if(audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function playTone(freq, startTime, duration, type, gainPeak){
  const ctx = getAudioCtx();
  if(!ctx) return;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type || 'sine';
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(0, ctx.currentTime + startTime);
  gain.gain.linearRampToValueAtTime(gainPeak||0.12, ctx.currentTime + startTime + 0.02);
  gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + startTime + duration);
  osc.connect(gain); gain.connect(ctx.destination);
  osc.start(ctx.currentTime + startTime);
  osc.stop(ctx.currentTime + startTime + duration + 0.05);
}
function playSound(name){
  if(!soundEnabled) return;
  try{
    if(name==='match') { playTone(660,0,0.14,'sine',0.12); playTone(880,0.09,0.18,'sine',0.12); }
    else if(name==='nest') { playTone(392,0,0.12,'triangle',0.1); playTone(523,0.08,0.16,'triangle',0.1); }
    else if(name==='buzz') { playTone(180,0,0.09,'sawtooth',0.05); playTone(160,0.06,0.09,'sawtooth',0.05); }
    else if(name==='seasonUp') { [523,659,784,1047].forEach((f,i)=>playTone(f,i*0.09,0.16,'sine',0.1)); }
    else if(name==='seasonDown') { [440,370].forEach((f,i)=>playTone(f,i*0.12,0.22,'sine',0.08)); }
    else if(name==='achievement') { [523,659,784,1047,1319].forEach((f,i)=>playTone(f,i*0.08,0.22,'triangle',0.11)); }
    else if(name==='levelup') { [392,523,659,784,1047,1319,1568].forEach((f,i)=>playTone(f,i*0.07,0.25,'sine',0.11)); }
  }catch(e){ /* audio not available \u2014 fine, just silent */ }
}

function burstConfetti(){
  const colors = ['#D9A62E','#6E5A9E','#4F6B3A','#9A4630','#8B6F47'];
  const container = document.createElement('div');
  container.style.cssText = 'position:fixed;inset:0;pointer-events:none;z-index:80;overflow:hidden;';
  document.body.appendChild(container);
  for(let i=0;i<28;i++){
    const piece = document.createElement('div');
    const left = Math.random()*100;
    const size = 6 + Math.random()*6;
    const color = colors[i % colors.length];
    const duration = 1.4 + Math.random()*0.9;
    const delay = Math.random()*0.3;
    const rotate = Math.random()*360;
    piece.style.cssText = `position:absolute;top:-20px;left:${left}%;width:${size}px;height:${size*0.6}px;background:${color};opacity:0.9;transform:rotate(${rotate}deg);animation:confetti-fall ${duration}s ease-in ${delay}s forwards;`;
    container.appendChild(piece);
  }
  setTimeout(()=> container.remove(), 2600);
}


function getOrCreatePlayerId(){
  try{

      localStorage.setItem('forage-nest-player-id', id);

  }catch(e){

    return 'player-session-' + Date.now()+'-'+Math.random().toString(36).slice(2);
  }
}

async function sbLoadPlayerRow(id){
  const params = new URLSearchParams();
  params.set('select', '*');
  params.set('id', `eq.${id}`);
  const res = await fetchWithRetries(`${SUPABASE_URL}/rest/v1/players?${params.toString()}`, {
    method: 'GET', headers: SUPABASE_HEADERS
  });
  if(!res.ok) throw new Error(`Could not load player state (${res.status})`);
  const rows = await res.json();
  return rows[0] || null;
}
async function sbSavePlayerRow(id, nickname, stats, species){
  const res = await fetchWithRetries(`${SUPABASE_URL}/rest/v1/players?on_conflict=id`, {
    method: 'POST',
    headers: {...SUPABASE_HEADERS, 'Prefer': 'resolution=merge-duplicates,return=minimal'},
    body: JSON.stringify({id, nickname, stats, species, updated_at: new Date().toISOString()})
  });
  if(!res.ok){
    let detail = '';
    try{ const j = await res.json(); detail = j.message || JSON.stringify(j); }catch(e){ detail = res.statusText; }
    throw new Error(`Could not save player state (${res.status}): ${detail}`);
  }
}

async function sbFetchAllPlayers(limit){
  const params = new URLSearchParams();
  params.set('select', 'nickname,stats,species');
  params.set('order', 'updated_at.desc');
  params.set('limit', String(limit||100));
  const res = await fetchWithRetries(`${SUPABASE_URL}/rest/v1/players?${params.toString()}`, {
    method: 'GET', headers: SUPABASE_HEADERS
  });
  if(!res.ok) throw new Error(`Could not load leaderboard (${res.status})`);
  return await res.json();
}

// Case-insensitive exact match (PostgREST's ilike with no wildcard characters does this).
// Returns true if the nickname is free, or already belongs to this same device/player.
async function sbIsNicknameAvailable(nickname, ownId){
  const params = new URLSearchParams();
  params.set('select', 'id');
  params.set('nickname', `ilike.${nickname}`);
  const res = await fetchWithRetries(`${SUPABASE_URL}/rest/v1/players?${params.toString()}`, {
    method: 'GET', headers: SUPABASE_HEADERS
  });
  if(!res.ok) throw new Error(`Could not check nickname availability (${res.status})`);
  const rows = await res.json();
  return rows.every(r => r.id === ownId);
}

async function sbFetchSightingsByPlayer(playerName, limit){

  params.set('player_name', `eq.${playerName}`);

// Re-keys an existing player row to a new id in place (used to migrate an anonymous
// device-based profile onto an authenticated account) \u2014 avoids the nickname-uniqueness
// constraint entirely since it's the same row, same nickname, just a new id value.
async function sbMigratePlayerId(oldId, newId){
  const res = await fetchWithRetries(`${SUPABASE_URL}/rest/v1/players?id=eq.${oldId}`, {
    method: 'PATCH',
    headers: {...SUPABASE_HEADERS, 'Prefer':'return=minimal'},
    body: JSON.stringify({ id: newId })
  });
  if(!res.ok){
    let detail = '';
    try{ const j = await res.json(); detail = j.message || JSON.stringify(j); }catch(e){ detail = res.statusText; }
    throw new Error(`Could not migrate account (${res.status}): ${detail}`);
  }
}

// ---------- SUPABASE AUTH (magic link) ----------
// Optional, additive layer: signing in gives a stable identity (auth.uid()) that follows
// you across any device/browser where you sign in with the same email. If you never sign
// in, the app works exactly as before via the anonymous device-based id.
let authClient = null;
let authSession = null;
let pendingAuthMigration = null;
try{
  if(window.supabase && window.supabase.createClient){
    authClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  }
}catch(e){ console.error('Auth client init failed: ' + String(e && e.message || e)); }

function initAuth(){
  if(!authClient) return;
  authClient.auth.onAuthStateChange((event, session)=>{
    authSession = session;
    if(event === 'SIGNED_IN' && session && session.user && playerId !== session.user.id){
      handleSignedIn(session);
    }
    if(event === 'SIGNED_OUT'){
      playerId = getOrCreatePlayerId();
      loadPlayer().then(render);
    }
  });
}

async function sendMagicLink(email){
  if(!authClient) throw new Error('Auth is unavailable right now.');
  const { error } = await authClient.auth.signInWithOtp({
    email, options: { emailRedirectTo: window.location.origin }
  });
  if(error) throw new Error(error.message);
}

async function handleSignedIn(session){
  const newId = session.user.id;
  const email = session.user.email;
  try{
    const existingRow = await sbLoadPlayerRow(newId);
    if(existingRow){
      playerId = newId;
      player = { nickname: existingRow.nickname, species: existingRow.species||{}, stats: Object.assign(defaultStats(), existingRow.stats||{}) };
      playerLoadFailed = false;
      showToast(`Welcome back, ${existingRow.nickname}!`);
      render();
      return;
    }
    // First time signing in with this email \u2014 see if there's local anonymous progress to offer migrating.
    const localId = getOrCreatePlayerId();
    let localRow = null;
    try{ localRow = await sbLoadPlayerRow(localId); }catch(e){}
    if(!localRow){
      playerId = newId;
      player = null;
      render();
      return;
    }
    pendingAuthMigration = { newId, email, localRow, localId };
    render();
  }catch(e){
    showToast('Sign-in succeeded but loading your account failed: ' + String(e && e.message || e));
  }
}

function migrationPromptHTML(){

    <button class="secondary" style="margin-top:10px;" id="migration-decline-btn">No, start fresh with this account</button>

}

async function acceptMigration(){
  const { newId, localId, localRow } = pendingAuthMigration;
  try{
    await sbMigratePlayerId(localId, newId);
    playerId = newId;
    player = { nickname: localRow.nickname, species: localRow.species||{}, stats: Object.assign(defaultStats(), localRow.stats||{}) };
    playerLoadFailed = false;
    showToast('Progress attached to your account!');
    pendingAuthMigration = null;
    render();
  }catch(e){
    showToast('Migration failed: ' + String(e && e.message || e));
  }
}

function declineMigration(){
  playerId = pendingAuthMigration.newId;
  player = null;
  pendingAuthMigration = null;
  render();
}

async function signOutOfAccount(){
  if(!authClient) return;
  try{ await authClient.auth.signOut(); }catch(e){ /* fall through to anonymous mode anyway */ }
}

async function savePlayer(){
  try{
    await sbSavePlayerRow(playerId, player.nickname, player.stats, player.species);
  }catch(e){
    console.error('save failed: ' + String(e && e.message || e));
    showToast('Could not save your progress \u2014 check your connection.');
  }
}

async function loadPlayer(){
  if(!playerId) playerId = getOrCreatePlayerId();
  try{
    const row = await sbLoadPlayerRow(playerId);
    if(row){
      player = { nickname: row.nickname, species: row.species || {}, stats: Object.assign(defaultStats(), row.stats||{}) };
    }else{
      player = null; // genuinely no saved progress for this device \u2014 safe to show the nickname gate
    }
    playerLoadFailed = false;
  }catch(e){
    console.error('load failed: ' + String(e && e.message || e));
    player = null;
    playerLoadFailed = true; // don't treat a failed load as "new player" \u2014 that could overwrite real progress
  }
}

let hasRenderedOnce = false;
function render(){
  const app = document.getElementById('app');
  if(pendingAuthMigration){
    app.innerHTML = migrationPromptHTML();
    document.getElementById('migration-accept-btn').addEventListener('click', acceptMigration);
    document.getElementById('migration-decline-btn').addEventListener('click', declineMigration);
    hasRenderedOnce = true;
    return;
  }
  if(!player){
    if(playerLoadFailed){
      app.innerHTML = loadErrorGateHTML();
      document.getElementById('player-load-retry').addEventListener('click', async ()=>{ await loadPlayer(); render(); });
      hasRenderedOnce = true;
      return;
    }
    app.innerHTML = gateHTML();
    document.getElementById('gate-btn').addEventListener('click', onGateSubmit);
    document.getElementById('gate-input').addEventListener('keydown', e=>{ if(e.key==='Enter') onGateSubmit(); });
    wireGateRestore();
    hasRenderedOnce = true;
    return;
  }
  app.innerHTML = shellHTML();
  wireShell();
  hasRenderedOnce = true;
}

function wireGateRestore(){
  const showBtn = document.getElementById('show-restore-btn');
  const panel = document.getElementById('restore-panel');
  const restoreBtn = document.getElementById('restore-btn');
  const restoreInput = document.getElementById('restore-input');
  if(showBtn) showBtn.addEventListener('click', ()=>{ panel.style.display = panel.style.display==='none' ? '' : 'none'; });
  if(restoreBtn) restoreBtn.addEventListener('click', restoreAccount);
  if(restoreInput) restoreInput.addEventListener('keydown', e=>{ if(e.key==='Enter') restoreAccount(); });

async function restoreAccount(){
  const input = document.getElementById('restore-input');
  const statusEl = document.getElementById('restore-status');
  const btn = document.getElementById('restore-btn');
  const code = input.value.trim();
  if(!code){ statusEl.textContent = 'Paste your account code first.'; return; }
  btn.disabled = true;
  btn.textContent = 'Checking\u2026';
  try{
    const row = await sbLoadPlayerRow(code);
    if(!row){
      statusEl.textContent = 'No account found with that code \u2014 double-check it and try again.';
      btn.disabled = false;
      btn.textContent = 'Restore account';
      return;
    }
    playerId = code;
    try{ localStorage.setItem('forage-nest-player-id', code); }catch(e){}
    player = { nickname: row.nickname, species: row.species || {}, stats: Object.assign(defaultStats(), row.stats||{}) };
    playerLoadFailed = false;
    showToast(`Welcome back, ${row.nickname}!`);
    render();
  }catch(e){
    statusEl.textContent = `Could not check that code \u2014 ${String(e && e.message || e)}.`;
    btn.disabled = false;
    btn.textContent = 'Restore account';
  }
}

async function onGateSubmit(){
  const input = document.getElementById('gate-input');
  const statusEl = document.getElementById('gate-nickname-status');
  const btn = document.getElementById('gate-btn');
  const val = input.value.trim();
  if(!val){ showToast('Enter a nickname first.'); return; }
  statusEl.textContent = '';
  btn.disabled = true;
  btn.textContent = 'Checking name\u2026';
  try{
    const available = await sbIsNicknameAvailable(val, playerId);
    if(!available){
      statusEl.textContent = `"${val}" is already taken \u2014 try another.`;
      btn.disabled = false;
      btn.textContent = 'Start recording';
      return;
    }
  }catch(e){
    statusEl.textContent = `Could not check name availability \u2014 ${String(e && e.message || e)}. Try again.`;
    btn.disabled = false;
    btn.textContent = 'Start recording';
    return;
  }
  player = {nickname: val, species:{}, stats: defaultStats()};
  try{
    await sbSavePlayerRow(playerId, player.nickname, player.stats, player.species);
  }catch(e){
    const msg = String(e && e.message || e);
    if(msg.toLowerCase().includes('duplicate') || msg.includes('23505')){
      statusEl.textContent = `"${val}" was just taken by someone else \u2014 try another.`;
    }else{
      statusEl.textContent = `Could not save \u2014 ${msg}. Try again.`;
    }
    player = null;
    btn.disabled = false;
    btn.textContent = 'Start recording';
    return;
  }
  render();
}

async function loadLeaderboard(){
  const container = document.getElementById('leaderboard-content');
  if(!container) return;
  try{
    const rows = await sbFetchAllPlayers(200);
    if(rows.length===0){ container.innerHTML = '<div class="empty">No players yet.</div>'; return; }
    const ranked = rows.map(r=>{
      const stats = Object.assign(defaultStats(), r.stats||{});
      const xp = computeXP(stats);
      const bestPop = Object.values(r.species||{}).reduce((m,s)=>Math.max(m, s.population||0), 0);
      return { nickname: r.nickname || 'anonymous', xp, level: levelInfo(xp).current, bestPop };
    }).sort((a,b)=> b.xp - a.xp).slice(0,50);

    container.innerHTML = `<div class="season-log">${ranked.map((r,i)=>`
      <div class="entry" style="display:flex;justify-content:space-between;align-items:center;${r.nickname===player.nickname?'background:var(--pollen-bg);':''}">
        <span><strong style="font-family:'Fraunces',serif;">#${i+1}</strong> ${escapeHTML(r.nickname)} ${r.nickname===player.nickname?'<span class="lat">(you)</span>':''}</span>
        <span style="text-align:right;font-size:12.5px;color:var(--ink-soft);">Lv.${r.level.level} \u00b7 ${r.level.name}<br>${r.xp} XP \u00b7 best pop. ${r.bestPop}</span>
      </div>`).join('')}</div>`;
  }catch(e){
    container.innerHTML = `<div class="empty">Could not load the leaderboard \u2014 ${escapeHTML(String(e && e.message || e))}.
      <div style="margin-top:10px;"><button class="secondary" id="leaderboard-retry">Retry</button></div></div>`;
    const btn = document.getElementById('leaderboard-retry');
    if(btn) btn.addEventListener('click', loadLeaderboard);
  }
}

      field2: {label:'Hole diameter (approx.)', options:['Narrow (2\u20134mm)','Medium (4\u20136mm)','Wide (6\u201310mm)']},

      field2: {label:'Concealment', options:['Well hidden','Semi-exposed','Fully exposed']},

    field2: {label:'Vegetation density', options:['Sparse','Moderate','Dense']},

  };
}

// ---------- EXPORT (CSV / GeoJSON) ----------
// Fully client-side \u2014 no network call. This is the recommended path into Supabase,
// QGIS, or Mergin when live sync isn't available: export here, import there.
function csvEscape(v){
  if(v===null || v===undefined) return '';
  const s = String(v);
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
}
const EXPORT_COLUMNS = [
  'type','id','speciesId','speciesCommon','plantLatin','plantCommon','isHostMatch','isForageCredit',
  'quantityEstimate','nestType','nestTypeLabel','field1Label','field1Value','field2Label','field2Value',
  'field3Label','field3Value','location','notes','playerName','lat','lon','timestamp'
];
function generateCSV(records){
  const header = EXPORT_COLUMNS.join(',');
  const rows = records.map(r => EXPORT_COLUMNS.map(c => csvEscape(r[c])).join(','));
  return [header, ...rows].join('\n');
}
function generateGeoJSON(records){
  const features = records.filter(r => r.lat!=null && r.lon!=null).map(r => ({
    type: 'Feature',
    geometry: { type: 'Point', coordinates: [r.lon, r.lat] },
    properties: Object.fromEntries(EXPORT_COLUMNS.filter(c=>c!=='lat'&&c!=='lon').map(c => [c, r[c] ?? null]))
  }));
  return JSON.stringify({ type: 'FeatureCollection', features }, null, 2);
}
function triggerDownload(filename, content, mimeType){
  const blob = new Blob([content], {type: mimeType});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=> URL.revokeObjectURL(url), 1000);
}
// Column names matching the exact Supabase table schema from the setup SQL, so the CSV
// import wizard auto-maps every column by name \u2014 no manual mapping needed. 'id' is
// deliberately excluded so Supabase generates fresh UUIDs rather than clashing with our
// local string IDs.
const SUPABASE_SIGHTING_MAP = [
  ['species_id','speciesId'],['species_common','speciesCommon'],['plant_latin','plantLatin'],
  ['plant_common','plantCommon'],['is_host_match','isHostMatch'],['is_forage_credit','isForageCredit'],
  ['quantity_estimate','quantityEstimate'],['location_text','location'],['notes','notes'],
  ['photo','photo'],['player_name','playerName'],['lat','lat'],['lon','lon'],['created_at','timestamp']
];
const SUPABASE_NEST_MAP = [
  ['species_id','speciesId'],['species_common','speciesCommon'],['nest_type','nestType'],
  ['nest_type_label','nestTypeLabel'],['location_text','location'],
  ['field1_label','field1Label'],['field1_value','field1Value'],
  ['field2_label','field2Label'],['field2_value','field2Value'],
  ['field3_label','field3Label'],['field3_value','field3Value'],
  ['notes','notes'],['photo','photo'],['player_name','playerName'],
  ['lat','lat'],['lon','lon'],['created_at','timestamp']
];
function generateSupabaseCSV(records, colMap){
  const header = colMap.map(([dbCol])=>dbCol).join(',');
  const rows = records.map(r => colMap.map(([,jsField]) => csvEscape(r[jsField])).join(','));
  return [header, ...rows].join('\n');
}
function wireAtlasExportButtons(){
  const csvBtn = document.getElementById('atlas-export-csv');
  const geoBtn = document.getElementById('atlas-export-geojson');
  const sbBtn = document.getElementById('atlas-export-supabase');
  const photosBtn = document.getElementById('atlas-export-photos');
  if(csvBtn) csvBtn.onclick = ()=>{
    if(atlasRecordsCache.length===0){ showToast('Wait for records to finish loading first.'); return; }
    triggerDownload('forage-and-nest-export.csv', generateCSV(atlasRecordsCache), 'text/csv');
  };
  if(geoBtn) geoBtn.onclick = ()=>{
    const withGps = atlasRecordsCache.filter(r=>r.lat!=null);
    if(withGps.length===0){ showToast('No GPS-tagged records to export yet.'); return; }
    triggerDownload('forage-and-nest-export.geojson', generateGeoJSON(atlasRecordsCache), 'application/geo+json');
  };
  if(sbBtn) sbBtn.onclick = ()=>{
    if(atlasRecordsCache.length===0){ showToast('Wait for records to finish loading first.'); return; }
    const sightings = atlasRecordsCache.filter(r=>r.type==='plant');
    const nests = atlasRecordsCache.filter(r=>r.type==='nest');
    if(sightings.length>0) triggerDownload('sightings.csv', generateSupabaseCSV(sightings, SUPABASE_SIGHTING_MAP), 'text/csv');
    setTimeout(()=>{
      if(nests.length>0) triggerDownload('nests.csv', generateSupabaseCSV(nests, SUPABASE_NEST_MAP), 'text/csv');
    }, 400);
    showToast('Downloading sightings.csv and nests.csv \u2014 import each into its matching Supabase table.');
  };
  if(photosBtn) photosBtn.onclick = downloadAllPhotos;
}

async function downloadAllPhotos(){
  if(atlasRecordsCache.length===0){ showToast('Wait for records to finish loading first.'); return; }
  const withPhotos = atlasRecordsCache.filter(r=>r.photo);
  if(withPhotos.length===0){ showToast('No photos logged yet.'); return; }
  if(typeof JSZip === 'undefined'){ showToast('Zip library failed to load \u2014 check your connection and reload.'); return; }
  showToast(`Zipping ${withPhotos.length} photo${withPhotos.length===1?'':'s'}\u2026`);
  try{
    const zip = new JSZip();
    withPhotos.forEach((r,i)=>{
      const base64 = (r.photo.split(',')[1]) || '';
      const rawName = r.type==='plant' ? (r.plantCommon||r.plantLatin||'plant') : (r.nestTypeLabel||'nest');
      const safeName = rawName.replace(/[^a-z0-9]+/gi,'-').toLowerCase().replace(/^-+|-+$/g,'');
      const dateStr = (r.timestamp||'').slice(0,10) || 'undated';
      zip.file(`${String(i+1).padStart(3,'0')}-${r.type}-${safeName}-${dateStr}.jpg`, base64, {base64:true});
    });
    const blob = await zip.generateAsync({type:'blob'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'forage-and-nest-photos.zip';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=> URL.revokeObjectURL(url), 2000);
  }catch(e){
    console.error('Photo zip failed: ' + String(e && e.message || e));
    showToast('Could not build the zip \u2014 try again.');
  }
}

// ---------- BEE VISION (camera filter, stylized not scientifically accurate) ----------
let beeVisionStream = null;
let beeVisionCapturedPhoto = null;

function beeVisionHTML(){
  return `<div class="card">
    <h2 style="font-size:19px;">Bee Vision</h2>
    <p style="color:var(--ink-soft);font-size:13.5px;margin-top:6px;">A stylized illustration of bee eyesight, not a scientific simulation \u2014 phone cameras can't capture UV light, which real bees see and use to find nectar guides invisible to us. This shifts colors toward blue/violet (bees can't see red at all) and overlays a honeycomb grid as a nod to the mosaic view from thousands of compound-eye facets.</p>
    <div id="beevision-stage-container"></div>
    <div class="beevision-controls"><button class="primary" id="beevision-start-btn">Start Bee Vision</button></div>
    <p class="photo-note">Uses your camera live \u2014 nothing is recorded, saved, or uploaded unless you tap Capture. Camera turns off automatically when you leave this tab. Capture a flower or nest site and send the photo straight into a log entry \u2014 the saved photo is the clean, real-colour version, so identification and documentation stay accurate; the bee-vision filter is just for fun while you look through the camera.</p>
  </div>`;
}

function wireBeeVision(){
  const startBtn = document.getElementById('beevision-start-btn');
  if(startBtn) startBtn.addEventListener('click', startBeeVision);
}

async function startBeeVision(){
  const stageContainer = document.getElementById('beevision-stage-container');
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    stageContainer.innerHTML = '<div class="empty">Camera access isn\u2019t supported in this browser.</div>';
    return;
  }
  try{
    beeVisionStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
    stageContainer.innerHTML = `<div class="beevision-stage">
      <video id="beevision-video" autoplay playsinline muted></video>
      <div class="beevision-hex-overlay"></div>
      <div class="beevision-vignette"></div>
    </div>`;
    document.getElementById('beevision-video').srcObject = beeVisionStream;
    showBeeVisionLiveControls();
    playSound('buzz');
  }catch(e){
    stageContainer.innerHTML = `<div class="empty">Could not access the camera \u2014 ${escapeHTML(String(e && e.message || e))}.</div>`;
  }
}

function showBeeVisionLiveControls(){
  const controls = document.querySelector('.beevision-controls');
  if(!controls) return;
  controls.innerHTML = `
    <button class="primary" id="beevision-capture-btn">\ud83d\udcf8 Capture Photo</button>
    <button class="secondary" id="beevision-stop-btn">Stop Bee Vision</button>`;
  const captureBtn = document.getElementById('beevision-capture-btn');
  const stopBtn = document.getElementById('beevision-stop-btn');
  if(captureBtn) captureBtn.addEventListener('click', captureBeeVisionPhoto);
  if(stopBtn) stopBtn.addEventListener('click', stopBeeVision);
}

function captureBeeVisionPhoto(){
  const video = document.getElementById('beevision-video');
  if(!video || !video.videoWidth){ showToast('Camera not ready yet \u2014 try again in a second.'); return; }
  const maxDim = 640;
  let w = video.videoWidth, h = video.videoHeight;
  if(w > h && w > maxDim){ h = Math.round(h*(maxDim/w)); w = maxDim; }
  else if(h > maxDim){ w = Math.round(w*(maxDim/h)); h = maxDim; }
  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d');
  // Deliberately capturing the clean, unfiltered frame \u2014 the bee-vision colour shift is
  // a fun *live viewing* effect only. Baking it into the saved photo made real identification
  // and documentation less accurate (a hue-rotated dandelion doesn't look like a dandelion).
  ctx.drawImage(video, 0, 0, w, h);
  beeVisionCapturedPhoto = canvas.toDataURL('image/jpeg', 0.8);
  playSound('buzz');
  renderBeeVisionCapturePreview();
}

function renderBeeVisionCapturePreview(){
  const controls = document.querySelector('.beevision-controls');
  if(!controls || !beeVisionCapturedPhoto) return;
  controls.innerHTML = `
    <div style="width:100%;">
      <img src="${beeVisionCapturedPhoto}" style="width:100%;max-width:280px;border:1px solid var(--line);display:block;margin-bottom:10px;">
      <div class="photo-row">
        <button type="button" class="photo-btn" id="use-for-plant-btn">Use for Plant Sighting</button>
        <button type="button" class="photo-btn" id="use-for-nest-btn">Use for Nest Site</button>
        <button type="button" class="secondary" id="retake-btn">Retake</button>
      </div>
    </div>`;
  const plantBtn = document.getElementById('use-for-plant-btn');
  const nestBtn = document.getElementById('use-for-nest-btn');
  const retakeBtn = document.getElementById('retake-btn');
  if(plantBtn) plantBtn.addEventListener('click', ()=> useBeeVisionPhotoFor('plant'));
  if(nestBtn) nestBtn.addEventListener('click', ()=> useBeeVisionPhotoFor('nest'));
  if(retakeBtn) retakeBtn.addEventListener('click', ()=>{ beeVisionCapturedPhoto = null; showBeeVisionLiveControls(); });
}

function useBeeVisionPhotoFor(kind){
  const photo = beeVisionCapturedPhoto;
  if(!photo) return;
  beeVisionCapturedPhoto = null;
  stopBeeVision();
  activeTab = kind;
  render();

  if(kind==='plant'){
    selectedPlantPhoto = photo;
    const preview = document.getElementById('plant-photo-preview');
    if(preview){
      preview.innerHTML = `<div class="photo-preview"><img src="${photo}"><button type="button" class="photo-remove" id="plant-photo-remove">\u00d7</button></div>`;
      const rm = document.getElementById('plant-photo-remove');
      if(rm) rm.addEventListener('click', ()=>{ selectedPlantPhoto = null; preview.innerHTML=''; });
    }
    const aiIdBox = document.getElementById('plant-ai-id');
    if(aiIdBox){
      aiIdBox.innerHTML = aiIdLoadingHTML();
      const organSel = document.getElementById('plant-organ');
      const organ = organSel ? organSel.value : 'flower';
      identifyPlantWithPlantNet(photo, organ).then(result=>{
        aiIdBox.innerHTML = aiIdResultHTML(result);
        aiIdBox.querySelectorAll('.ai-chip').forEach(chip=>{
          chip.addEventListener('click', ()=>{
            const s = result.suggestions[parseInt(chip.dataset.aiIdx,10)];
            selectPlantResult({latin: s.latin, common: s.common});
            showToast('Pl@ntNet suggestion applied \u2014 double-check it before logging.');
          });
        });
      }).catch(e=>{
        console.error('Pl@ntNet ID failed: ' + String(e && e.message || e));
        aiIdBox.innerHTML = aiIdErrorHTML(String(e && e.message || e));
      });
    }
    attachDeviceLocationTo('plant', (loc)=>{ selectedPlantLocation = loc; });
  }else{
    selectedNestPhoto = photo;
    const preview = document.getElementById('nest-photo-preview');
    if(preview){
      preview.innerHTML = `<div class="photo-preview"><img src="${photo}"><button type="button" class="photo-remove" id="nest-photo-remove">\u00d7</button></div>`;
      const rm = document.getElementById('nest-photo-remove');
      if(rm) rm.addEventListener('click', ()=>{ selectedNestPhoto = null; preview.innerHTML=''; });
    }
    attachDeviceLocationTo('nest', (loc)=>{ selectedNestLocation = loc; });
  }
  showToast('Bee Vision photo added \u2014 finish filling in the details below.');
}

// Bee Vision captures have no EXIF (canvas images never do), so attempt the device's live
// GPS automatically as a substitute \u2014 same as tapping "Use my current location" manually.
async function attachDeviceLocationTo(prefix, setLocation){
  const badge = document.getElementById(`${prefix}-location-badge`);
  if(badge) badge.innerHTML = `<p class="photo-note">Getting your location for this Bee Vision photo\u2026</p>`;
  try{
    const loc = await getDeviceLocation();
    setLocation({...loc, source:'device'});
    if(badge){
      const current = prefix==='plant' ? selectedPlantLocation : selectedNestLocation;
      badge.innerHTML = locationBadgeHTML(current, `${prefix}-location`);
      const clearBtn = document.getElementById(`${prefix}-location-clear`);
      if(clearBtn) clearBtn.addEventListener('click', ()=>{ setLocation(null); badge.innerHTML = locationBadgeHTML(null, `${prefix}-location`); });
    }
  }catch(e){
    if(badge) badge.innerHTML = locationBadgeHTML(null, `${prefix}-location`);
    // Silent otherwise \u2014 the manual "Use my current location" button is still right there.
  }
}

function stopBeeVision(){
  if(beeVisionStream){
    beeVisionStream.getTracks().forEach(t=>t.stop());
    beeVisionStream = null;
  }
  beeVisionCapturedPhoto = null;
  const stageContainer = document.getElementById('beevision-stage-container');
  const controls = document.querySelector('.beevision-controls');
  if(stageContainer) stageContainer.innerHTML = '';
  if(controls) controls.innerHTML = `<button class="primary" id="beevision-start-btn">Start Bee Vision</button>`;
  wireBeeVision();
}

// ---------- FIELD MODE (real GPS proximity rewards) ----------
let fieldWatchId = null;
let fieldTargets = [];
let fieldFoundIds = new Set();
const FIELD_REWARD_RADIUS_M = 30;

function fieldModeHTML(sp){
  return `<div class="card">
    <h2 style="font-size:19px;">Field Mode</h2>
    <p style="color:var(--ink-soft);font-size:13.5px;margin-top:6px;">Walk toward a real, GPS-tagged nest site or plant patch logged for ${escapeHTML(sp.common)} and get a live distance readout \u2014 with a real reward when you're actually standing near one, within ${FIELD_REWARD_RADIUS_M}m.</p>
    <div class="photo-row"><button type="button" class="photo-btn" id="field-start-btn">Start proximity tracking</button></div>
    <div id="field-status" class="field-status"></div>
    <div id="field-radar" class="radar-list"></div>
  </div>`;
}

function wireFieldMode(sp){
  const startBtn = document.getElementById('field-start-btn');
  if(startBtn) startBtn.addEventListener('click', ()=> startFieldMode(sp));
}

async function startFieldMode(sp){
  const statusEl = document.getElementById('field-status');
  const radarEl = document.getElementById('field-radar');
  const startBtn = document.getElementById('field-start-btn');
  if(!navigator.geolocation){ showToast('Geolocation not supported on this device.'); return; }
  statusEl.textContent = 'Loading nearby targets\u2026';
  try{
    const nests = (await sbFetchNests(sp.id)).filter(n=>n.lat!=null).map(n=>({...n, kind:'nest', label: n.nestTypeLabel||'Nest site'}));
    const sightings = (await sbFetchSightings(sp.id)).filter(s=>s.lat!=null).map(s=>({...s, kind:'plant', label: s.plantCommon||s.plantLatin||'Plant'}));
    fieldTargets = [...nests, ...sightings];
  }catch(e){
    statusEl.textContent = 'Could not load targets \u2014 ' + String(e && e.message || e);
    return;
  }
  if(fieldTargets.length===0){
    statusEl.textContent = 'No GPS-tagged records for this species yet \u2014 nothing to track toward.';
    radarEl.innerHTML = '';
    return;
  }
  fieldFoundIds = new Set();
  if(startBtn) startBtn.style.display = 'none';
  statusEl.innerHTML = `<button class="secondary" id="field-stop-btn">Stop tracking</button>`;
  const stopBtn0 = document.getElementById('field-stop-btn');
  if(stopBtn0) stopBtn0.addEventListener('click', stopFieldMode);

  fieldWatchId = navigator.geolocation.watchPosition(
    pos => updateFieldRadar(pos.coords.latitude, pos.coords.longitude, sp),
    err => {
      statusEl.innerHTML = `Location error: ${escapeHTML(err.message||'permission denied')}. <button class="secondary" id="field-stop-btn">Stop</button>`;
      const b = document.getElementById('field-stop-btn');
      if(b) b.addEventListener('click', stopFieldMode);
    },
    { enableHighAccuracy:true, maximumAge:5000, timeout:15000 }
  );
}

function updateFieldRadar(lat, lon, sp){
  const radarEl = document.getElementById('field-radar');
  if(!radarEl) return;
  const withDist = fieldTargets.map(t=>({...t, dist: haversineMeters(lat,lon,t.lat,t.lon)})).sort((a,b)=>a.dist-b.dist);
  withDist.forEach(t=>{
    if(t.dist <= FIELD_REWARD_RADIUS_M && !fieldFoundIds.has(t.id)){
      fieldFoundIds.add(t.id);
      rewardFieldFind(t, sp);
    }
  });
  radarEl.innerHTML = withDist.slice(0,8).map(t=>{
    const found = fieldFoundIds.has(t.id);
    const distLabel = t.dist < 1000 ? Math.round(t.dist)+'m' : (t.dist/1000).toFixed(1)+'km';
    return `<div class="radar-item ${found?'found':''}">
      <span>${found?'\u2713 ':''}${escapeHTML(t.label)}${t.kind==='nest' ? ' <span class="lat">(nest)</span>' : ''}</span>
      <span class="radar-dist">${distLabel}</span>
    </div>`;
  }).join('');
}

async function rewardFieldFind(target, sp){
  const st = ensureSpeciesState(sp.id);
  st.population = Math.min(150, st.population + 3);
  player.stats.totalFieldFinds = (player.stats.totalFieldFinds||0) + 1;
  const newAch = checkAchievements();
  await savePlayer();
  playSound('achievement');
  burstConfetti();
  showToast(`Found it in real life! ${target.label} \u2014 +3 population`);
  newAch.forEach((a,i)=> setTimeout(()=>showAchievementToast(a), 1000+i*1800));
}

function stopFieldMode(){
  if(fieldWatchId!=null){ navigator.geolocation.clearWatch(fieldWatchId); fieldWatchId = null; }
  const statusEl = document.getElementById('field-status');
  const radarEl = document.getElementById('field-radar');
  if(statusEl) statusEl.innerHTML = '';
  if(radarEl) radarEl.innerHTML = '';
  const startBtn = document.getElementById('field-start-btn');
  if(startBtn) startBtn.style.display = '';
}

// ---------- POLLINATOR RUSH (arcade mini-game) ----------
let minigameInterval = null;
let minigameTimer = null;
let minigameActive = false;
let minigameScore = 0;
let minigameSpeciesId = null;

function minigameHTML(sp){
  return `<div class="card">
    <h2 style="font-size:19px;">Pollinator Rush</h2>
    <p style="color:var(--ink-soft);font-size:13.5px;margin-top:6px;">Flowers drift down the meadow \u2014 tap only the target flower shown at top before it reaches the bottom. 30 seconds, as many correct taps as you can get. A good score earns a real population bonus for ${escapeHTML(sp.common)}.</p>
    <div id="minigame-area"></div>
  </div>`;
}

function wireMinigame(sp){
  minigameSpeciesId = sp.id;
  const area = document.getElementById('minigame-area');
  if(!area) return;
  area.innerHTML = `<div class="photo-row"><button class="primary" id="minigame-start-btn">Start Pollinator Rush</button></div>`;
  const btn = document.getElementById('minigame-start-btn');
  if(btn) btn.addEventListener('click', startMinigame);
}

function startMinigame(){
  const area = document.getElementById('minigame-area');
  if(!area) return;
  minigameActive = true;
  minigameScore = 0;
  let timeLeft = 30;
  const target = ALL_HOST_PLANTS[Math.floor(Math.random()*ALL_HOST_PLANTS.length)];
  const targetColor = '#6E5A9E';
  const decoyColors = ['#D9A62E','#4F6B3A','#9A4630','#7C9760'];

  area.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:13.5px;">
      <span>Tap: <strong>${iconFlower(20,targetColor)} ${escapeHTML(target.common)}</strong></span>
      <span>Score: <strong id="minigame-score">0</strong> \u00b7 <strong id="minigame-timer">30</strong>s</span>
    </div>
    <div class="minigame-stage" id="minigame-stage"></div>`;

  const stage = document.getElementById('minigame-stage');

  minigameInterval = setInterval(()=>{
    if(!minigameActive) return;
    spawnMinigameFlower(stage, target, targetColor, decoyColors);
  }, 700);

  minigameTimer = setInterval(()=>{
    timeLeft -= 1;
    const timerEl = document.getElementById('minigame-timer');
    if(timerEl) timerEl.textContent = timeLeft;
    if(timeLeft<=0) endMinigame();
  }, 1000);
}

function spawnMinigameFlower(stage, target, targetColor, decoyColors){
  if(!stage) return;
  const isTarget = Math.random() < 0.4;
  const color = isTarget ? targetColor : decoyColors[Math.floor(Math.random()*decoyColors.length)];
  const el = document.createElement('div');
  el.style.position = 'absolute';
  el.style.left = (5 + Math.random()*85) + '%';
  el.style.top = '-40px';
  el.style.cursor = 'pointer';
  el.style.transition = `top ${3.2 + Math.random()*1.2}s linear`;
  el.innerHTML = iconFlower(34, color);
  el.dataset.isTarget = isTarget ? '1' : '0';
  stage.appendChild(el);
  requestAnimationFrame(()=>{ el.style.top = (stage.clientHeight + 40) + 'px'; });

  const cleanup = ()=>{ if(el.parentNode) el.parentNode.removeChild(el); };
  el.addEventListener('transitionend', cleanup);
  el.addEventListener('click', ()=>{
    if(!minigameActive) return;
    if(el.dataset.isTarget === '1'){ minigameScore += 1; playSound('match'); }
    else{ playSound('buzz'); }
    const scoreEl = document.getElementById('minigame-score');
    if(scoreEl) scoreEl.textContent = minigameScore;
    cleanup();
  });
}

async function endMinigame(){
  minigameActive = false;
  clearInterval(minigameInterval); minigameInterval = null;
  clearInterval(minigameTimer); minigameTimer = null;
  const area = document.getElementById('minigame-area');
  const bonus = Math.min(20, Math.round(minigameScore/2));
  const sp = SPECIES_BY_ID[minigameSpeciesId];
  const st = sp ? ensureSpeciesState(sp.id) : null;
  if(st) st.population = Math.min(150, st.population + bonus);
  player.stats.totalMiniGamePlays = (player.stats.totalMiniGamePlays||0) + 1;
  const improved = minigameScore > (player.stats.bestMiniGameScore||0);
  if(improved) player.stats.bestMiniGameScore = minigameScore;
  const newAch = checkAchievements();
  await savePlayer();
  if(area){
    area.innerHTML = `<div class="event-card pos">
      ${iconMascot(40,'celebrate')}
      <div>
        <div style="font-family:'Fraunces',serif;font-size:16px;">Final score: ${minigameScore}${improved?' \u2014 new best!':''}</div>
        <div style="font-size:13px;color:var(--ink-soft);margin-top:2px;">+${bonus} population for ${sp?escapeHTML(sp.common):'your species'}</div>
      </div>
    </div>
    <div class="photo-row" style="margin-top:14px;"><button class="primary" id="minigame-start-btn">Play again</button></div>`;
    const btn = document.getElementById('minigame-start-btn');
    if(btn) btn.addEventListener('click', startMinigame);
  }
  playSound(bonus>0?'seasonUp':'buzz');
  if(bonus>=5) burstConfetti();
  newAch.forEach((a,i)=> setTimeout(()=>showAchievementToast(a), 800+i*1800));
}

function stopMinigame(){
  minigameActive = false;
  if(minigameInterval){ clearInterval(minigameInterval); minigameInterval = null; }
  if(minigameTimer){ clearInterval(minigameTimer); minigameTimer = null; }
}

let leafletMap = null; // tracked so we can tear it down cleanly between tab switches

async function loadSiteMap(speciesId){
  const container = document.getElementById('site-map-content');
  if(!container) return;
  try{
    if(typeof L === 'undefined') throw new Error('Map library failed to load \u2014 check your connection and reload the page.');

    const nests = (await sbFetchNests(speciesId)).filter(n=>n.lat!=null);
    const sightings = (await sbFetchSightings(speciesId)).filter(s=>s.lat!=null);
    if(nests.length===0 && sightings.length===0){
      container.innerHTML = '<div class="empty">No GPS-tagged records for this species yet. Attach a location when logging a plant sighting or nest site to see them mapped here.</div>';
      return;
    }

    container.innerHTML = `<div id="site-map-leaflet" style="height:420px;border:1px solid var(--line);"></div>`;
    if(leafletMap){ leafletMap.remove(); leafletMap = null; }
    leafletMap = L.map('site-map-leaflet');
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors',
      maxZoom: 19
    }).addTo(leafletMap);

    const bounds = [];

    nests.forEach(n=>{
      bounds.push([n.lat, n.lon]);
      L.circle([n.lat, n.lon], {radius: FORAGE_RANGE_M, color:'#8B6F47', weight:1.4, dashArray:'6 5', fillOpacity:0.05}).addTo(leafletMap);
    });

    nests.forEach(n=>{
      sightings.forEach(p=>{
        if(!p.isForageCredit || (p.quantityEstimate||0) < HIGH_QUANTITY_THRESHOLD) return;
        if(haversineMeters(n.lat, n.lon, p.lat, p.lon) <= FORAGE_RANGE_M){
          L.polyline([[n.lat,n.lon],[p.lat,p.lon]], {color:'#4F6B3A', weight:2.5}).addTo(leafletMap);
        }
      });
    });

    sightings.forEach(p=>{
      bounds.push([p.lat, p.lon]);
      const color = p.isForageCredit ? (p.quantityEstimate>=HIGH_QUANTITY_THRESHOLD ? '#4F6B3A' : '#7C9760') : '#B9B79A';
      const marker = L.circleMarker([p.lat, p.lon], {radius:7, color:'#F7F6EC', weight:1.5, fillColor:color, fillOpacity:1}).addTo(leafletMap);
      marker.bindPopup(`<strong>${escapeHTML(p.plantCommon||p.plantLatin||'Plant')}</strong><br><em>${escapeHTML(p.plantLatin||'')}</em><br>${escapeHTML(p.location||'')}<br><span style="color:#666;">${escapeHTML(p.playerName||'')}</span>`);
    });

    nests.forEach(n=>{
      const marker = L.circleMarker([n.lat, n.lon], {radius:9, color:'#F7F6EC', weight:2, fillColor:'#5B4530', fillOpacity:1}).addTo(leafletMap);
      marker.bindPopup(`<strong>${escapeHTML(n.nestTypeLabel||'Nest site')}</strong><br>${escapeHTML(n.field1Value||'')}, ${escapeHTML(n.field2Value||'')}<br>${escapeHTML(n.location||'')}<br><span style="color:#666;">${escapeHTML(n.playerName||'')}</span>`);
    });

    if(bounds.length===1){
      leafletMap.setView(bounds[0], 16);
    }else{
      leafletMap.fitBounds(bounds, {padding:[30,30]});
    }

    const linkedCount = nests.reduce((acc,n)=> acc + sightings.filter(p=> p.isForageCredit && (p.quantityEstimate||0)>=HIGH_QUANTITY_THRESHOLD && haversineMeters(n.lat,n.lon,p.lat,p.lon)<=FORAGE_RANGE_M).length, 0);

    container.insertAdjacentHTML('beforeend', `
      <div class="map-legend">
        <span class="swatch"><span class="dot" style="background:#5B4530;border:2px solid #D9A62E;"></span>Nest site (${nests.length})</span>
        <span class="swatch"><span class="dot" style="background:#4F6B3A;"></span>High-quantity forage match (${sightings.filter(p=>p.isForageCredit && p.quantityEstimate>=HIGH_QUANTITY_THRESHOLD).length})</span>
        <span class="swatch"><span class="dot" style="background:#7C9760;"></span>Smaller forage match</span>
        <span class="swatch"><span class="dot" style="background:#B9B79A;"></span>Other plant record</span>
        <span class="swatch">${linkedCount} patch\u2013nest link${linkedCount===1?'':'s'} within range</span>
      </div>`);
  }catch(e){
    container.innerHTML = `<div class="empty">Could not load the site map \u2014 ${escapeHTML(e.message||'check the Supabase connection')}.
      <div style="margin-top:10px;"><button class="secondary" id="site-map-retry">Retry</button></div></div>`;
    const retryBtn = document.getElementById('site-map-retry');
    if(retryBtn) retryBtn.addEventListener('click', ()=> loadSiteMap(speciesId));
  }
}

// Round coordinates to ~11m precision before anything gets saved to the shared atlas.
// Rounded to 6 decimal places (~0.1m) \u2014 essentially full device GPS precision, since
// consumer GPS accuracy itself is typically 3\u201310m regardless of how many digits are stored.
function roundCoord(n){ return Math.round(n * 1000000) / 1000000; }

// Minimal JPEG EXIF GPS reader \u2014 walks the APP1 EXIF segment for GPSLatitude/GPSLongitude tags.
// Returns {lat, lon} or null. Many phones strip this on upload/share, so this is best-effort.
function readExifGPS(arrayBuffer){
  try{
    const view = new DataView(arrayBuffer);
    if(view.getUint16(0) !== 0xFFD8) return null; // not a JPEG
    let offset = 2;
    while(offset < view.byteLength){
      const marker = view.getUint16(offset);
      if(marker === 0xFFE1){
        const exifStart = offset + 4;
        if(view.getUint32(exifStart) !== 0x45786966) { offset += 2 + view.getUint16(offset+2); continue; } // "Exif"
        const tiffStart = exifStart + 6;
        const little = view.getUint16(tiffStart) === 0x4949;
        const get16 = (o)=> view.getUint16(o, little);
        const get32 = (o)=> view.getUint32(o, little);
        const ifd0Offset = tiffStart + get32(tiffStart+4);
        const numEntries = get16(ifd0Offset);
        let gpsIfdOffset = null;
        for(let i=0;i<numEntries;i++){
          const entry = ifd0Offset + 2 + i*12;
          if(get16(entry) === 0x8825){ gpsIfdOffset = tiffStart + get32(entry+8); break; }
        }
        if(gpsIfdOffset === null) return null;
        const gpsCount = get16(gpsIfdOffset);
        const gps = {};
        for(let i=0;i<gpsCount;i++){
          const entry = gpsIfdOffset + 2 + i*12;
          const tag = get16(entry);
          const valueOffset = tiffStart + get32(entry+8);
          if(tag===1||tag===3) gps[tag===1?'latRef':'lonRef'] = String.fromCharCode(view.getUint8(entry+8));
          if(tag===2||tag===4){
            const vals = [0,1,2].map(j=>{
              const num = get32(valueOffset + j*8), den = get32(valueOffset + j*8 + 4);
              return den ? num/den : 0;
            });
            gps[tag===2?'lat':'lon'] = vals[0] + vals[1]/60 + vals[2]/3600;
          }
        }
        if(gps.lat==null || gps.lon==null) return null;
        let lat = gps.lat, lon = gps.lon;
        if(gps.latRef === 'S') lat = -lat;
        if(gps.lonRef === 'W') lon = -lon;
        return {lat: roundCoord(lat), lon: roundCoord(lon)};
      }
      offset += 2 + view.getUint16(offset+2);
    }
    return null;
  }catch(e){ return null; }
}

function getDeviceLocation(){
  return new Promise((resolve, reject)=>{
    if(!navigator.geolocation){ reject(new Error('Geolocation not supported in this browser.')); return; }
    navigator.geolocation.getCurrentPosition(
      pos => resolve({lat: roundCoord(pos.coords.latitude), lon: roundCoord(pos.coords.longitude)}),
      err => reject(new Error(err.code===1 ? 'Location permission denied.' : 'Could not get your location.')),
      {enableHighAccuracy:true, timeout:10000}
    );
  });
}

// Resize/compress an image file into a small base64 JPEG so it fits in text-only storage.
function fileToCompressedDataURL(file, maxDim, quality){
  return new Promise((resolve, reject)=>{
    if(!file || !file.type || !file.type.startsWith('image/')){ reject(new Error('not an image')); return; }
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('read failed'));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('decode failed'));
      img.onload = () => {
        let w = img.width, h = img.height;
        if(w > h && w > maxDim){ h = Math.round(h * (maxDim/w)); w = maxDim; }
        else if(h > maxDim){ w = Math.round(w * (maxDim/h)); h = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function wirePhotoControls(prefix, onPhotoReady, onLocationReady, onPhotoAttached){
  const cameraBtn = document.getElementById(`${prefix}-photo-camera-btn`);
  const uploadBtn = document.getElementById(`${prefix}-photo-upload-btn`);
  const cameraInput = document.getElementById(`${prefix}-photo-camera`);
  const uploadInput = document.getElementById(`${prefix}-photo-upload`);
  const preview = document.getElementById(`${prefix}-photo-preview`);

  cameraBtn.addEventListener('click', ()=> cameraInput.click());
  uploadBtn.addEventListener('click', ()=> uploadInput.click());

  async function handleFile(fileList){
    const file = fileList && fileList[0];
    if(!file) return;
    try{
      const dataUrl = await fileToCompressedDataURL(file, 640, 0.6);
      // guard against oversized strings even after compression
      if(dataUrl.length > 900000){
        showToast('Photo too large even after compression \u2014 try a different one.');
        return;
      }
      onPhotoReady(dataUrl);
      preview.innerHTML = `<div class="photo-preview"><img src="${dataUrl}"><button type="button" class="photo-remove" id="${prefix}-photo-remove">\u00d7</button></div>`;
      document.getElementById(`${prefix}-photo-remove`).addEventListener('click', ()=>{
        onPhotoReady(null);
        preview.innerHTML = '';
      });
      // Best-effort: pull GPS out of the photo's EXIF data, if present and not already set.
      if(onLocationReady && file.type === 'image/jpeg'){
        try{
          const buf = await file.arrayBuffer();
          const gps = readExifGPS(buf);
          if(gps) onLocationReady({...gps, source:'exif'});
        }catch(e){ /* no EXIF, or unreadable \u2014 fine, user can use device location instead */ }
      }
      if(onPhotoAttached) onPhotoAttached(dataUrl);
    }catch(e){
      showToast('Could not read that photo \u2014 camera access may be blocked here. Try "Upload a photo" instead.');
    }
  }

  cameraInput.addEventListener('change', ()=> handleFile(cameraInput.files));
  uploadInput.addEventListener('change', ()=> handleFile(uploadInput.files));
}

function selectPlantResult(result){

  document.getElementById('plant-suggestions').innerHTML = '';
  const sp = SPECIES_BY_ID[activeSpeciesId];
  const isKeyMatch = ((sp.hosts||sp.keyForage)||[]).some(h=>h.latin.toLowerCase()===result.latin.toLowerCase());
  let badge;

async function searchPlant(q, box){
  box.innerHTML = '<div class="suggestion">Searching\u2026</div>';
  let results = [];
  let liveOk = false;
  try{
    const res = await fetch(`https://api.inaturalist.org/v1/taxa?q=${encodeURIComponent(q)}&rank=species&iconic_taxa=Plantae&per_page=6`);
    if(res.ok){
      const data = await res.json();
      results = (data.results||[]).map(r=>({latin:r.name, common:(r.preferred_common_name||'').toLowerCase()}));
      liveOk = true;
    }
  }catch(e){ /* fall through to local */ }
  if(!liveOk || results.length===0){
    const ql = q.toLowerCase();
    results = ALL_HOST_PLANTS.filter(p => p.latin.toLowerCase().includes(ql) || p.common.toLowerCase().includes(ql));
  }
  if(results.length===0){
    box.innerHTML = `<div class="suggestion">No matches. <span style="color:var(--ink-soft);">Try a different spelling, or use the exact scientific name.</span></div>`;
    return;
  }
  box.innerHTML = `<div class="suggestions">${results.slice(0,6).map((r,i)=>
    `<div class="suggestion" data-idx="${i}"><span>${r.common||'(no common name)'}</span> <span class="lat">${r.latin}</span></div>`
  ).join('')}</div><div class="api-note">${liveOk ? 'Live lookup via iNaturalist taxon search.' : 'Live iNaturalist lookup unavailable here \u2014 showing local matches.'}</div>`;
  box.querySelectorAll('.suggestion[data-idx]').forEach(el=>{
    el.addEventListener('click', ()=> selectPlantResult(results[parseInt(el.dataset.idx,10)]));
  });
}

// Pl@ntNet blocks direct browser calls from arbitrary origins (CORS) \u2014 confirmed via
// testing, contrary to what I assumed earlier. Routed through our own Netlify function
// instead, which talks to Pl@ntNet server-to-server (not subject to browser CORS).
async function identifyPlantWithPlantNet(dataUrl, organ){
  const base64 = dataUrl.split(',')[1];
  const response = await fetchWithRetries('/.netlify/functions/identify-plant', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ image: base64, organ: organ || 'flower' })
  });
  const rawText = await response.text();
  let parsed;
  try{
    parsed = JSON.parse(rawText);
  }catch(e){
    throw new Error(`Server returned an unexpected (non-JSON) response: ${rawText.slice(0,200)}`);
  }
  if(!response.ok) throw new Error(parsed.error || 'Pl@ntNet identification request failed');
  return parsed;
}
