// Round coordinates to ~11m precision before anything gets saved to the shared atlas.
// Rounded to 6 decimal places (~0.1m) \u2014 essentially full device GPS precision, since
// consumer GPS accuracy itself is typically 3\u201310m regardless of how many digits are stored.
function roundCoord(n){ return Math.round(n * 1000000) / 1000000; }

// Minimal JPEG EXIF GPS reader \u2014 walks the APP1 EXIF segment for GPSLatitude/GPSLongitude tags.
// Returns {lat, lon} or null. Many phones strip this on upload/share, so this is best-effort.
function readExifGPS(arrayBuffer){
  try{
    const view = new DataView(arrayBuffer);
    if(view.getUint16(0) !== 0xFFD8) return null; // not a JPEG
    let offset = 2;
    while(offset < view.byteLength){
      const marker = view.getUint16(offset);
      if(marker === 0xFFE1){
        const exifStart = offset + 4;
        if(view.getUint32(exifStart) !== 0x45786966) { offset += 2 + view.getUint16(offset+2); continue; } // "Exif"
        const tiffStart = exifStart + 6;
        const little = view.getUint16(tiffStart) === 0x4949;
        const get16 = (o)=> view.getUint16(o, little);
        const get32 = (o)=> view.getUint32(o, little);
        const ifd0Offset = tiffStart + get32(tiffStart+4);
        const numEntries = get16(ifd0Offset);
        let gpsIfdOffset = null;
        for(let i=0;i<numEntries;i++){
          const entry = ifd0Offset + 2 + i*12;
          if(get16(entry) === 0x8825){ gpsIfdOffset = tiffStart + get32(entry+8); break; }
        }
        if(gpsIfdOffset === null) return null;
        const gpsCount = get16(gpsIfdOffset);
        const gps = {};
        for(let i=0;i<gpsCount;i++){
          const entry = gpsIfdOffset + 2 + i*12;
          const tag = get16(entry);
          const valueOffset = tiffStart + get32(entry+8);
          if(tag===1||tag===3) gps[tag===1?'latRef':'lonRef'] = String.fromCharCode(view.getUint8(entry+8));
          if(tag===2||tag===4){
            const vals = [0,1,2].map(j=>{
              const num = get32(valueOffset + j*8), den = get32(valueOffset + j*8 + 4);
              return den ? num/den : 0;
            });
            gps[tag===2?'lat':'lon'] = vals[0] + vals[1]/60 + vals[2]/3600;
          }
        }
        if(gps.lat==null || gps.lon==null) return null;
        let lat = gps.lat, lon = gps.lon;
        if(gps.latRef === 'S') lat = -lat;
        if(gps.lonRef === 'W') lon = -lon;
        return {lat: roundCoord(lat), lon: roundCoord(lon)};
      }
      offset += 2 + view.getUint16(offset+2);
    }
    return null;
  }catch(e){ return null; }
}

function getDeviceLocation(){
  return new Promise((resolve, reject)=>{
    if(!navigator.geolocation){ reject(new Error('Geolocation not supported in this browser.')); return; }
    navigator.geolocation.getCurrentPosition(
      pos => resolve({lat: roundCoord(pos.coords.latitude), lon: roundCoord(pos.coords.longitude)}),
      err => reject(new Error(err.code===1 ? 'Location permission denied.' : 'Could not get your location.')),
      {enableHighAccuracy:true, timeout:10000}
    );
  });
}

// Resize/compress an image file into a small base64 JPEG so it fits in text-only storage.
function fileToCompressedDataURL(file, maxDim, quality){
  return new Promise((resolve, reject)=>{
    if(!file || !file.type || !file.type.startsWith('image/')){ reject(new Error('not an image')); return; }
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('read failed'));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('decode failed'));
      img.onload = () => {
        let w = img.width, h = img.height;
        if(w > h && w > maxDim){ h = Math.round(h * (maxDim/w)); w = maxDim; }
        else if(h > maxDim){ w = Math.round(w * (maxDim/h)); h = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function wirePhotoControls(prefix, onPhotoReady, onLocationReady, onPhotoAttached){
  const cameraBtn = document.getElementById(`${prefix}-photo-camera-btn`);
  const uploadBtn = document.getElementById(`${prefix}-photo-upload-btn`);
  const cameraInput = document.getElementById(`${prefix}-photo-camera`);
  const uploadInput = document.getElementById(`${prefix}-photo-upload`);
  const preview = document.getElementById(`${prefix}-photo-preview`);

  cameraBtn.addEventListener('click', ()=> cameraInput.click());
  uploadBtn.addEventListener('click', ()=> uploadInput.click());

  async function handleFile(fileList){
    const file = fileList && fileList[0];
    if(!file) return;
    try{
      const dataUrl = await fileToCompressedDataURL(file, 640, 0.6);
      // guard against oversized strings even after compression
      if(dataUrl.length > 900000){
        showToast('Photo too large even after compression \u2014 try a different one.');
        return;
      }
      onPhotoReady(dataUrl);
      preview.innerHTML = `<div class="photo-preview"><img src="${dataUrl}"><button type="button" class="photo-remove" id="${prefix}-photo-remove">\u00d7</button></div>`;
      document.getElementById(`${prefix}-photo-remove`).addEventListener('click', ()=>{
        onPhotoReady(null);
        preview.innerHTML = '';
      });
      // Best-effort: pull GPS out of the photo's EXIF data, if present and not already set.
      if(onLocationReady && file.type === 'image/jpeg'){
        try{
          const buf = await file.arrayBuffer();
          const gps = readExifGPS(buf);
          if(gps) onLocationReady({...gps, source:'exif'});
        }catch(e){ /* no EXIF, or unreadable \u2014 fine, user can use device location instead */ }
      }
      if(onPhotoAttached) onPhotoAttached(dataUrl);
    }catch(e){
      showToast('Could not read that photo \u2014 camera access may be blocked here. Try "Upload a photo" instead.');
    }
  }

  cameraInput.addEventListener('change', ()=> handleFile(cameraInput.files));
  uploadInput.addEventListener('change', ()=> handleFile(uploadInput.files));
}

async function searchPlant(q, box){
  box.innerHTML = '<div class="suggestion">Searching\u2026</div>';
  let results = [];
  let liveOk = false;
  try{
    const res = await fetch(`https://api.inaturalist.org/v1/taxa?q=${encodeURIComponent(q)}&rank=species&iconic_taxa=Plantae&per_page=6`);
    if(res.ok){
      const data = await res.json();
      results = (data.results||[]).map(r=>({latin:r.name, common:(r.preferred_common_name||'').toLowerCase()}));
      liveOk = true;
    }
  }catch(e){ /* fall through to local */ }
  if(!liveOk || results.length===0){
    const ql = q.toLowerCase();
    results = ALL_HOST_PLANTS.filter(p => p.latin.toLowerCase().includes(ql) || p.common.toLowerCase().includes(ql));
  }
  if(results.length===0){
    box.innerHTML = `<div class="suggestion">No matches. <span style="color:var(--ink-soft);">Try a different spelling, or use the exact scientific name.</span></div>`;
    return;
  }
  box.innerHTML = `<div class="suggestions">${results.slice(0,6).map((r,i)=>
    `<div class="suggestion" data-idx="${i}"><span>${r.common||'(no common name)'}</span> <span class="lat">${r.latin}</span></div>`
  ).join('')}</div><div class="api-note">${liveOk ? 'Live lookup via iNaturalist taxon search.' : 'Live iNaturalist lookup unavailable here \u2014 showing local matches.'}</div>`;
  box.querySelectorAll('.suggestion[data-idx]').forEach(el=>{
    el.addEventListener('click', ()=> selectPlantResult(results[parseInt(el.dataset.idx,10)]));
  });
}

// Pl@ntNet blocks direct browser calls from arbitrary origins (CORS) \u2014 confirmed via
// testing, contrary to what I assumed earlier. Routed through our own Netlify function
// instead, which talks to Pl@ntNet server-to-server (not subject to browser CORS).
async function identifyPlantWithPlantNet(dataUrl, organ){
  const base64 = dataUrl.split(',')[1];
  const response = await fetchWithRetries('/.netlify/functions/identify-plant', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ image: base64, organ: organ || 'flower' })
  });
  const rawText = await response.text();
  let parsed;
  try{
    parsed = JSON.parse(rawText);
  }catch(e){
    throw new Error(`Server returned an unexpected (non-JSON) response: ${rawText.slice(0,200)}`);
  }
  if(!response.ok) throw new Error(parsed.error || 'Pl@ntNet identification request failed');
  return parsed;
}

async function submitPlantSighting(){
  if(!selectedPlant){ showToast('Search for and select a plant first.'); return; }
  const location = document.getElementById('plant-location').value.trim();
  if(!location){ showToast('Add a location before logging.'); return; }
  const notes = document.getElementById('plant-notes').value.trim();
  const sp = SPECIES_BY_ID[activeSpeciesId];
  const isKeyMatch = ((sp.hosts||sp.keyForage)||[]).some(h=>plantMatchesHost(selectedPlant.latin, h.latin));
  const isForageCredit = sp.forageType === 'generalist' ? true : isKeyMatch;
  const record = {
    id: 'sighting-'+Date.now()+'-'+Math.random().toString(36).slice(2,7),
    type: 'plant',
    speciesId: activeSpeciesId,
    speciesCommon: sp.common,
    plantLatin: selectedPlant.latin,
    plantCommon: selectedPlant.common,
    isHostMatch: isKeyMatch,
    isForageCredit,
    location, notes,
    quantityEstimate: parseInt(document.getElementById('plant-quantity').value, 10),
    lat: selectedPlantLocation ? selectedPlantLocation.lat : null,
    lon: selectedPlantLocation ? selectedPlantLocation.lon : null,
    locationSource: selectedPlantLocation ? selectedPlantLocation.source : null,
    photo: selectedPlantPhoto || null,
    playerName: player.nickname,
    timestamp: new Date().toISOString(),
  };
  try{
    await sbInsertSighting(record);
  }catch(e){ showToast('Could not save to Supabase \u2014 check your connection.'); console.error(String(e && e.message || e)); return; }
  player.stats.totalSightings += 1;
  if(record.photo) player.stats.totalPhotos += 1;
  if(isForageCredit){
    const st = ensureSpeciesState(activeSpeciesId);
    st.pendingForage += 1;
  }
  const streakChanged = registerDailyActivity();
  const newAch = checkAchievements();
  await savePlayer();
  playSound(isKeyMatch ? 'match' : 'buzz');
  showToast(isKeyMatch ? 'Logged \u2014 confirmed forage match!' : (isForageCredit ? 'Logged as a forage record.' : 'Logged to the community atlas.'));
  activeTab = 'colony';
  render();
  if(streakChanged && player.stats.currentStreak>1) setTimeout(()=> showToast(`\ud83d\udd25 ${player.stats.currentStreak}-day streak!`), 1400);
  newAch.forEach((a,i)=> setTimeout(()=>showAchievementToast(a), (streakChanged?1400:0)+i*1800));
}

  const fields = nestFieldsFor(sp.nestType);
  const record = {
    id: 'nest-'+Date.now()+'-'+Math.random().toString(36).slice(2,7),
    type: 'nest',
    speciesId: activeSpeciesId,
    speciesCommon: sp.common,
    nestType: sp.nestType,
    nestTypeLabel: NEST_TYPES[sp.nestType].label,
    location,
    field1Label: fields.field1.label, field1Value: document.getElementById('nest-field1').value,
    field2Label: fields.field2.label, field2Value: document.getElementById('nest-field2').value,
    field3Label: fields.field3.label, field3Value: document.getElementById('nest-field3').value,
    notes: document.getElementById('nest-notes').value.trim(),
    lat: selectedNestLocation ? selectedNestLocation.lat : null,
    lon: selectedNestLocation ? selectedNestLocation.lon : null,
    locationSource: selectedNestLocation ? selectedNestLocation.source : null,
    photo: selectedNestPhoto || null,
    playerName: player.nickname,
    timestamp: new Date().toISOString(),
  };
  try{
    await sbInsertNest(record);
  }catch(e){ showToast('Could not save to Supabase \u2014 check your connection.'); console.error(String(e && e.message || e)); return; }
  const st = ensureSpeciesState(activeSpeciesId);
  st.pendingNests += 1;
  player.stats.totalNests += 1;
  if(record.photo) player.stats.totalPhotos += 1;
  const streakChanged = registerDailyActivity();
  const newAch = checkAchievements();
  await savePlayer();
  playSound('nest');
  showToast('Nesting site logged.');
  activeTab = 'colony';
  render();
  if(streakChanged && player.stats.currentStreak>1) setTimeout(()=> showToast(`\ud83d\udd25 ${player.stats.currentStreak}-day streak!`), 1400);
  newAch.forEach((a,i)=> setTimeout(()=>showAchievementToast(a), (streakChanged?1400:0)+i*1800));
}

function wireColony(){
  const adv = document.getElementById('advance-btn');
  if(adv) adv.addEventListener('click', advanceSeason);
  const rei = document.getElementById('reintroduce-btn');
  if(rei) rei.addEventListener('click', reintroduce);
}

async function advanceSeason(){
  const btn = document.getElementById('advance-btn');
  if(btn){ btn.disabled = true; btn.textContent = 'Checking the landscape\u2026'; }
  const sp = SPECIES_BY_ID[activeSpeciesId];
  const st = ensureSpeciesState(activeSpeciesId);
  const xpBefore = computeXP(player.stats);
  const levelBefore = levelInfo(xpBefore).current.level;
  const forage = Math.min(st.pendingForage, 4) * 4;
  const nest = Math.min(st.pendingNests, 3) * 6;
  const base = -6;
  const event = EVENTS[Math.floor(Math.random()*EVENTS.length)];
  const linkage = await findResourceLinkage(activeSpeciesId);
  const resourceBonus = linkage.linked ? 10 : 0;
  const net = forage + nest + base + event.delta + resourceBonus;
  st.population = Math.max(0, Math.min(150, st.population + net));
  st.seasons += 1;
  st.pendingForage = 0;
  st.pendingNests = 0;
  player.stats.totalSeasons += 1;
  if(linkage.linked) player.stats.totalLinkageBonuses = (player.stats.totalLinkageBonuses||0) + 1;
  const entry = {
    season: st.seasons,
    text: `${sp.common} population ${net>=0?'grew':'declined'} to ${st.population}.`,
    forage, nest, eventText: event.text, eventDelta: event.delta, resourceBonus, linked: linkage.linked, net
  };
  st.log.push(entry);
  if(st.log.length>12) st.log.shift();
  if(st.population===0) st.status='extinct';
  const newAch = checkAchievements();
  await savePlayer();
  lastEventReveal = {speciesId: activeSpeciesId, entry};
  render();
  const xpAfter = computeXP(player.stats);
  const levelAfter = levelInfo(xpAfter).current.level;
  if(levelAfter > levelBefore){
    setTimeout(()=>{ playSound('levelup'); burstConfetti(); showToast(`Level up! You're now ${levelInfo(xpAfter).current.name}.`); }, 300);
    newAch.forEach((a,i)=> setTimeout(()=>showAchievementToast(a), 1200 + i*1800));
  }else{
    playSound(net>=0 ? 'seasonUp' : 'seasonDown');
    newAch.forEach((a,i)=> setTimeout(()=>showAchievementToast(a), i*1800));
  }
}

async function reintroduce(){
  const st = ensureSpeciesState(activeSpeciesId);
  st.population = 25;
  st.status = 'active';
  await savePlayer();
  showToast('Reintroduction effort started.');
  render();
}

async function loadAtlas(){
  const container = document.getElementById('atlas-content');
  if(!container) return;
  wireAtlasExportButtons();
  try{
    const [sightings, nests] = await Promise.all([sbFetchSightings(null, 200), sbFetchNests(null, 200)]);
    const records = [...sightings, ...nests];
    atlasRecordsCache = records;
    if(records.length===0){
      container.innerHTML = '<div class="empty">No community records yet \u2014 be the first to log a sighting or nest site.</div>';
      return;
    }
    records.sort((a,b)=> new Date(b.timestamp) - new Date(a.timestamp));
    const bySpecies = {};
    records.forEach(r=>{ (bySpecies[r.speciesId] = bySpecies[r.speciesId]||[]).push(r); });

    const totalPlants = records.filter(r=>r.type==='plant').length;
    const totalMatches = records.filter(r=>r.type==='plant' && r.isHostMatch).length;
    const totalNests = records.filter(r=>r.type==='nest').length;
    const totalGeotagged = records.filter(r=>r.lat!=null).length;

    let html = `<div class="count-row">
      <span><b style="font-family:'Fraunces',serif;font-size:16px;color:var(--ink);">${totalPlants}</b> plant records</span>
      <span><b style="font-family:'Fraunces',serif;font-size:16px;color:var(--ink);">${totalMatches}</b> confirmed forage matches</span>
      <span><b style="font-family:'Fraunces',serif;font-size:16px;color:var(--ink);">${totalNests}</b> nesting sites</span>
      <span><b style="font-family:'Fraunces',serif;font-size:16px;color:var(--ink);">${totalGeotagged}</b> with GPS</span>
    </div>`;

    html += `<label style="margin-top:6px;">Recent activity</label>`;
    html += records.slice(0,12).map(r=>{
      const thumb = r.photo ? `<img class="feed-thumb" src="${r.photo}">` : '';
      const mapLink = r.lat!=null ? ` \u00b7 <a href="https://www.google.com/maps?q=${r.lat},${r.lon}" target="_blank" rel="noopener" style="color:var(--flower);">\ud83d\udccd map</a>` : '';
      if(r.type==='plant'){
        const qtyLabel = r.quantityEstimate>=200?'large stand':r.quantityEstimate>=50?'sizeable patch':r.quantityEstimate>=10?'small patch':'a few plants';
        return `<div class="feed-item">
          ${thumb}
          <div class="feed-body">
            <span class="tag ${r.isHostMatch?'match':'plant'}">${r.isHostMatch?'forage match':'plant'}</span>
            ${escapeHTML(r.plantCommon||r.plantLatin)} <span style="font-style:italic;color:var(--ink-soft);">(${escapeHTML(r.plantLatin)})</span> \u00b7 ${qtyLabel} \u2014 for ${escapeHTML(r.speciesCommon)}
            <div class="meta">${escapeHTML(r.playerName)} \u00b7 ${escapeHTML(r.location)}${mapLink} \u00b7 ${new Date(r.timestamp).toLocaleDateString()}</div>
          </div>
        </div>`;
      }
      return `<div class="feed-item">
        ${thumb}
        <div class="feed-body">
          <span class="tag nest">${escapeHTML(r.nestTypeLabel || 'nest site')}</span>
          ${escapeHTML(r.field1Value||'')}, ${escapeHTML((r.field2Value||'').toLowerCase())}, ${escapeHTML((r.field3Value||'').toLowerCase())} \u2014 for ${escapeHTML(r.speciesCommon)}
          <div class="meta">${escapeHTML(r.playerName)} \u00b7 ${escapeHTML(r.location)}${mapLink} \u00b7 ${new Date(r.timestamp).toLocaleDateString()}</div>
        </div>
      </div>`;
    }).join('');

    container.innerHTML = html;
  }catch(e){
    container.innerHTML = `<div class="empty">Could not load shared records \u2014 ${escapeHTML(e.message||'check the Supabase connection')}.
      <div style="margin-top:10px;"><button class="secondary" id="atlas-retry">Retry</button></div></div>`;
    const retryBtn = document.getElementById('atlas-retry');
    if(retryBtn) retryBtn.addEventListener('click', loadAtlas);
  }
}

// ---------- INIT ----------
function showFatalError(err){
  const app = document.getElementById('app');
  if(app){
    app.innerHTML = `<div class="gate">
      <h2>Something went wrong</h2>
      <p>The app hit an error while loading instead of showing a blank screen. Details below \u2014 share this with whoever is fixing it.</p>
      <pre style="white-space:pre-wrap;font-size:12px;background:#fff;border:1px solid var(--line);padding:10px;overflow:auto;">${escapeHTML(String(err && err.stack || err))}</pre>
      <button class="secondary" onclick="location.reload()" style="margin-top:12px;">Reload</button>
    </div>`;
  }
}

function handleGlobalError(err){
  if(hasRenderedOnce){
    // Something already on screen and working \u2014 don't nuke it for a stray background error.
    console.error('Non-fatal error after render: ' + String(err && err.message || err));
    return;
  }
  showFatalError(err);
}

window.addEventListener('error', (e)=> handleGlobalError(e.error || e.message));
document.addEventListener('visibilitychange', ()=>{ if(document.hidden) stopBeeVision(); });
window.addEventListener('unhandledrejection', (e)=> handleGlobalError(e.reason));

(async function init(){
  try{
    initAuth();
    await loadPlayer();
    render();
  }catch(e){
    showFatalError(e);
  }
})();
</script>
